<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมัครสมาชิก · ฟิตเนสใกล้คุณ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<header class="site"><h1>ฟิตเนสใกล้คุณ</h1><nav></nav><div class="who"></div></header>
<main class="page">
  <section class="card auth">
    <h2>สมัครสมาชิก</h2>
    <p class="sub">สมัครฟรี ใช้ชื่อผู้ใช้กับรหัสผ่านเท่านั้น</p>
    <form id="form" novalidate>
      <div class="field"><label for="username">ชื่อผู้ใช้ (3–30 ตัว: A-Z a-z 0-9 _ . -)</label>
        <input id="username" name="username" autocomplete="username" required autofocus></div>
      <div class="field"><label for="password">รหัสผ่าน (อย่างน้อย 6 ตัว)</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required></div>
      <div class="field"><label for="confirm">ยืนยันรหัสผ่าน</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required></div>
      <p id="err" class="err" role="alert"></p>
      <button class="primary" type="submit">สมัครสมาชิก</button>
    </form>
    <p class="alt">มีบัญชีอยู่แล้ว? <a href="/login.html">เข้าสู่ระบบ</a></p>
  </section>
</main>
<script src="/auth.js"></script>
<script>renderHeader(); setupAuthForm("/auth/register");</script>
</body>
</html>
